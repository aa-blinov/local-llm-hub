name: ci

# Установка, тесты, проверка синтаксиса. Тесты не зависят от macOS и не требуют моделей.
# Проверка стандарта оформления — отдельный workflow (house-style.yml).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Install, test, syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[dev]'

      - name: Test
        run: python3 -m pytest -q tests

      - name: Syntax
        run: |
          python3 -m py_compile src/llm_hub/*.py
          node --check src/llm_hub/static/app.js
          bash -n scripts/bootstrap.sh
          bash -n install.command
