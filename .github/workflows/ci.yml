name: ci

# Install, test and check syntax. Tests do not depend on macOS and need no models.
# The house-style check is a separate workflow (house-style.yml).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Install, test, syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[dev]'

      - name: Test
        run: python3 -m pytest -q tests

      - name: Syntax
        run: |
          python3 -m py_compile src/llm_hub/*.py
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          test -z "$(git status --porcelain src/llm_hub/static/app)" || (echo 'Built app is out of date: run npm run build in frontend/ and commit it' && git status --short src/llm_hub/static/app && exit 1)
          bash -n scripts/bootstrap.sh
          bash -n install.command
