name: release

# Tag-triggered release. A tag of v* builds the Python distribution and
# publishes it with the changelog section for that version as the body.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Extract the version and its changelog section
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "No changelog section for $VERSION"; exit 1; }

      - name: Build
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
