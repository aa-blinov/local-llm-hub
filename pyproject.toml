[project]
name = "local-llm-hub"
version = "0.2.0"
description = "Web panel to run local LLMs on Apple Silicon: choose an engine (MLX or llama.cpp), a model and its parameters."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "huggingface_hub>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
